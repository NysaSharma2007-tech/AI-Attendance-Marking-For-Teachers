<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Attendance Marker</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><h1>Teacher Attendance Marker</h1><p>Mark and manage student attendance easily.</p></div><button id="clear">Clear All</button></header><section class="controls"><input id="class" placeholder="Class / Section"><input id="date" type="date"><input id="search" placeholder="Search student"><button id="add">+ Add Student</button></section><section class="stats"><div><b id="total">0</b>Total</div><div><b id="present">0</b>Present</div><div><b id="absent">0</b>Absent</div><div><b id="percent">0%</b>Attendance</div></section><table><thead><tr><th>#</th><th>Name</th><th>Roll No.</th><th>Status</th><th>Action</th></tr></thead><tbody id="list"></tbody></table><footer><button id="allP">Mark All Present</button><button id="allA">Mark All Absent</button><button id="csv">Export CSV</button></footer></main><script src="script.js"></script></body></html>
